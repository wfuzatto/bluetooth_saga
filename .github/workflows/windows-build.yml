name: Compilar e testar diagnóstico Bluetooth Saga

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 - offline, PowerShell, C# e EXE
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar ambiente e testes offline completos
        shell: pwsh
        run: ./scripts/Test-SagaBle.ps1 -OfflineOnly
      - name: Compilar release
        run: dotnet build src/SagaBle.Diagnostic/SagaBle.Diagnostic.csproj --configuration Release --no-restore
      - name: Publicar EXE Windows x64 autossuficiente
        run: dotnet publish src/SagaBle.Diagnostic/SagaBle.Diagnostic.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: SagaBleDiagnostico-Windows-x64
          path: dist/SagaBleDiagnostico.exe
          if-no-files-found: error
